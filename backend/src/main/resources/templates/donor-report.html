<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: A4;
            margin: 15mm;
            @bottom-right {
                content: "Страница " counter(page) " из " counter(pages);
                font-family: "Roboto", sans-serif;
                font-size: 9pt;
            }
        }
        body { font-family: "Roboto", sans-serif; color: #0f172a; line-height: 1.4; }
        h1 { color: #3b82f6; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }

        .donor-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            page-break-inside: avoid;
        }

        .score-badge {
            float: right;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10pt;
            font-weight: bold;
            background-color: #3b82f6;
        }
        .perfect { background-color: #10b981 !important; }
        .warning { background-color: #eab308 !important; }
        .danger { background-color: #ef4444 !important; }

        .donor-title { font-weight: bold; font-size: 14pt; margin-bottom: 5px; }
        .donor-meta { font-size: 10pt; color: #64748b; }
        .component-box { margin-top: 15px; padding-left: 10px; border-left: 3px solid #cbd5e1; }
        .warning-text { color: #ef4444; font-size: 10pt; list-style-type: none; padding-left: 0; }
    </style>
</head>
<body>

<h1>Отчет по подбору доноров</h1>
<p th:text="'Дата формирования: ' + ${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy HH:mm')}"></p>

<div th:each="res : ${results}" class="donor-card">
    <div class="score-badge"
         th:classappend="${res.totalPenalty() == 0 ? 'perfect' : (res.totalPenalty() > 20 ? 'danger' : 'warning')}"
         th:text="${res.totalPenalty() == 0 ? 'Идеально' : 'Штраф: ' + res.totalPenalty()}">
    </div>

    <div class="donor-title" th:text="${res.donorDevice()?.name() ?: 'Устройство без названия'}"></div>

    <div class="donor-meta">
        Инв №: <span th:text="${res.donorDevice()?.inventoryNumber() ?: '—'}"></span> |
        Статус: <span th:text="${res.donorDevice()?.lifeCycleState()?.getInfraName() ?: 'Неизвестно'}"></span>
    </div>
    <div class="donor-meta" th:text="'Путь: ' + ${res.donorDevice()?.locationPath() ?: 'Не указан'}"></div>

    <div class="component-box">
        <div th:each="comp : ${res.compatibleComponents()}">
            <strong th:text="${comp.externalInfo()?.externalName()}"></strong>
            <div th:if="${#lists.isEmpty(comp.componentWarnings())}" style="color: #10b981; font-size: 9pt;">
                ✓ Полная совместимость
            </div>
            <ul class="warning-text" th:if="${!#lists.isEmpty(comp.componentWarnings())}">
                <li th:each="w : ${comp.componentWarnings()}" th:text="'— ' + ${w.message()}"></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
